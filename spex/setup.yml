schema_version: "1.0"
workflow:
  id: spex-setup
  name: Spex Setup
  version: "6.1.0"
  description: >-
    Install spex extensions and configure agent harness.
    Single-command entry point for Claude Code, Codex, OpenCode, or any spec-kit harness.

inputs:
  integration:
    type: string
    default: ""
    prompt: "Agent harness (auto, claude, codex, opencode)"
  extensions:
    type: string
    default: ""
    prompt: "Extensions to enable (recommended, all, interactive, or comma-separated list)"
  security:
    type: string
    default: ""
    prompt: "Requested security (safe, autonomous, yolo, or interactive)"
  permissions:
    type: string
    default: ""
    prompt: "Deprecated security alias (none, standard, or yolo)"

steps:
  - id: check-version
    type: shell
    run: |
      version_output=$(specify version 2>/dev/null) || {
        echo "ERROR: specify CLI not found. Install with:" >&2
        echo "  uv tool install specify-cli --force --from git+https://github.com/github/spec-kit.git" >&2
        exit 1
      }
      version=$(echo "$version_output" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)
      [ -n "$version" ] || { echo "ERROR: Cannot parse specify version" >&2; exit 1; }
      major=$(echo "$version" | cut -d. -f1)
      if [ "$major" -ge 1 ] 2>/dev/null; then
        printf "%s" "$version"
        exit 0
      fi
      echo "ERROR: spec-kit $version too old (requires >= 1.0.0). Upgrade:" >&2
      echo "  uv tool install specify-cli --force --from git+https://github.com/github/spec-kit.git" >&2
      exit 1

  - id: validate-source
    type: shell
    run: |
      SOURCE="${SPEX_SOURCE:-$SPECKIT_WORKFLOW_DIR}"
      if [ -z "$SOURCE" ]; then
        echo "ERROR: Cannot determine spex source directory." >&2
        echo "Run from a file (specify workflow run spex/setup.yml)" >&2
        echo "or set SPEX_SOURCE." >&2
        exit 1
      fi
      if [ ! -d "$SOURCE/extensions/spex" ]; then
        echo "ERROR: Spex extensions not found at $SOURCE/extensions/spex" >&2
        exit 1
      fi
      printf "%s" "$SOURCE"

  # Snapshot the registry before the extensions are reinstalled, so the apply
  # step reports only real changes. On a refresh without an explicit
  # selection, drop spex-detach from a legacy declaration that listed it while
  # leaving it disabled (FR-023), before the declaration is read.
  # scripts/spex-setup-report.sh prints this step's stderr by its id.
  # Nothing has changed the registry yet, so the live registry is the state
  # before reinstalling.
  - id: snapshot-registry
    type: shell
    run: |
      SOURCE="{{ steps.validate-source.output.stdout }}"
      REGISTRY=".specify/extensions/.registry"
      EXTENSIONS="{{ inputs.extensions }}"
      if [ -z "$EXTENSIONS" ] && [ -f .specify/spex.json ] && [ -f "$REGISTRY" ]; then
        "$SOURCE/scripts/spex-setup-profile.py" migrate-detach --root "$(pwd)" --before "$REGISTRY" || exit 1
      fi
      printf "ok"

  - id: resolve-request
    type: shell
    run: |
      SOURCE="{{ steps.validate-source.output.stdout }}"
      TOOL="$SOURCE/scripts/spex-setup-profile.py"
      [ -x "$TOOL" ] || { echo "ERROR: setup profile utility unavailable: $TOOL" >&2; exit 1; }
      set -- resolve --root "$(pwd)"
      INTEGRATION="{{ inputs.integration }}"
      EXTENSIONS="{{ inputs.extensions }}"
      SECURITY="{{ inputs.security }}"
      LEGACY_PERMISSIONS="{{ inputs.permissions }}"
      [ -z "$INTEGRATION" ] || set -- "$@" --harness "$INTEGRATION"
      case "$EXTENSIONS" in ""|interactive|recommended|all) ;; *) set -- "$@" --extensions "$EXTENSIONS" ;; esac
      case "$SECURITY" in ""|interactive) ;; *) set -- "$@" --security "$SECURITY" ;; esac
      if [ -z "$SECURITY" ] && [ -n "$LEGACY_PERMISSIONS" ]; then
        set -- "$@" --legacy-permissions "$LEGACY_PERMISSIONS"
      fi
      "$TOOL" "$@"

  - id: detect-agent
    type: shell
    run: |
      REQUEST='{{ steps.resolve-request.output.stdout }}'
      INPUT="{{ inputs.integration }}"
      [ -n "$INPUT" ] || INPUT=$(printf '%s' "$REQUEST" | jq -r '.harness')
      case "$INPUT" in
        auto) ;;
        claude|codex|opencode) printf "%s" "$INPUT"; exit 0 ;;
        *) echo "ERROR: Unknown integration '$INPUT'. Use: auto, claude, codex, opencode" >&2; exit 1 ;;
      esac
      DETECT_SCRIPT="${SPEX_SOURCE:-$SPECKIT_WORKFLOW_DIR}/scripts/hooks/shared/detect-agent.sh"
      if [ -f "$DETECT_SCRIPT" ]; then
        AGENT=$(sh "$DETECT_SCRIPT" "$(pwd)")
        printf "%s" "${AGENT:-claude}"
      else
        printf "%s" "claude"
      fi

  # The extension selection and the security choice are resolved and
  # validated before anything is reinstalled, so an invalid input stops setup
  # before any extension changes.
  - id: extension-mode
    type: shell
    run: |
      INPUT="{{ inputs.extensions }}"
      if [ -n "$INPUT" ]; then
        printf "%s" "$INPUT"
      elif [ -f .specify/spex.json ]; then
        printf '%s' '{{ steps.resolve-request.output.stdout }}' | jq -j '.extensions | join(",")'
      else
        printf "interactive"
      fi

  # Interactive mode has no workflow prompt: spec-kit's prompt step does not
  # return the agent's reply (its output carries only the exit code), and
  # substituting free agent text into shell source could not be made safe
  # anyway. It applies the empty-reply fallback (recommended) and says so;
  # the agent asks the user and passes an explicit selection instead. stdout carries no
  # trailing newline, so consumers can match ",<list>," patterns.
  # scripts/spex-setup-report.sh prints this step's stderr by its id.
  - id: selected-extensions
    type: shell
    run: |
      MODE="{{ steps.extension-mode.output.stdout }}"
      SOURCE="{{ steps.validate-source.output.stdout }}"
      case "$MODE" in
        interactive)
          echo "NOTE: the interactive reply cannot be read back from the agent; applying the recommended set. Re-run setup with -i extensions=NAME,NAME (or all) to choose another selection." >&2
          set -- --mode interactive
          ;;
        recommended|all) set -- --mode "$MODE" ;;
        *) set -- --extensions "spex,$MODE" ;;
      esac
      RESOLVED=$("$SOURCE/scripts/spex-setup-profile.py" resolve --root "$(pwd)" "$@") || exit 1
      printf '%s' "$RESOLVED" | jq -j '.extensions | join(",")'

  - id: security-mode
    type: shell
    run: |
      INPUT="{{ inputs.security }}"
      LEGACY="{{ inputs.permissions }}"
      if [ -n "$INPUT" ]; then
        printf "%s" "$INPUT"
      elif [ -n "$LEGACY" ]; then
        case "$LEGACY" in
          none) printf "safe" ;;
          standard) printf "autonomous" ;;
          yolo) printf "yolo" ;;
          *) echo "ERROR: Unknown deprecated permissions '$LEGACY'. Use none, standard, or yolo" >&2; exit 1 ;;
        esac
      elif [ -f .specify/spex.json ]; then
        printf '%s' '{{ steps.resolve-request.output.stdout }}' | jq -j '.security'
      else
        printf "interactive"
      fi

  - id: selected-security
    type: shell
    run: |
      MODE="{{ steps.security-mode.output.stdout }}"
      if [ "$MODE" = "interactive" ]; then
        # Same limitation as selected-extensions: the reply is not returned.
        SELECTED="safe"
        echo "NOTE: the interactive reply cannot be read back from the agent; applying safe. Re-run setup with -i security=autonomous or -i security=yolo to choose another level." >&2
      else
        SELECTED="$MODE"
      fi
      SELECTED=$(printf '%s' "$SELECTED" | tr -d '"[:space:]')
      case "$SELECTED" in safe|autonomous|yolo) printf "%s" "$SELECTED" ;;
        *) echo "ERROR: Unknown security '$SELECTED'. Use safe, autonomous, or yolo" >&2; exit 1 ;;
      esac

  - id: migrate-commands
    type: shell
    run: |
      found=false
      for f in .claude/commands/speckit.*.md; do
        [ -f "$f" ] || continue
        found=true
        break
      done
      if [ "$found" = true ]; then
        for f in .claude/commands/speckit.*.md; do
          [ -f "$f" ] || continue
          rm "$f"
        done
        echo "Migrated old commands to skills format" >&2
      fi
      printf "ok"

  - id: init-project
    type: shell
    run: |
      AGENT="{{ steps.detect-agent.output.stdout }}"
      specify init --here --integration "$AGENT" --script sh --force

  # Keep a copy of the registry as it was before reinstalling, so
  # apply-extensions reports only real changes (it removes the copy).
  - id: snapshot-before-install
    type: shell
    run: |
      REGISTRY=".specify/extensions/.registry"
      SNAPSHOT=".specify/extensions/.registry.before"
      rm -f "$SNAPSHOT"
      if [ -f "$REGISTRY" ]; then
        cp "$REGISTRY" "$SNAPSHOT"
      fi
      printf "ok"

  - id: install-ext-spex
    type: shell
    run: |
      SOURCE="${SPEX_SOURCE:-$SPECKIT_WORKFLOW_DIR}"
      EXT="spex"
      EXT_PATH="$SOURCE/extensions/$EXT"
      [ -f "$EXT_PATH/extension.yml" ] || { echo "Extension $EXT not found at $EXT_PATH" >&2; exit 1; }
      if [ -d ".specify/extensions/$EXT" ]; then
        echo "y" | specify extension remove "$EXT" >/dev/null 2>&1 || true
      fi
      # Always --dev: without it specify treats the path as a catalog name.
      # --dev copies the extension into the project, so a temporary source
      # can be deleted afterwards.
      specify extension add "$EXT_PATH" --dev

  - id: install-ext-spex-gates
    type: shell
    run: |
      SOURCE="${SPEX_SOURCE:-$SPECKIT_WORKFLOW_DIR}"
      EXT="spex-gates"
      EXT_PATH="$SOURCE/extensions/$EXT"
      [ -f "$EXT_PATH/extension.yml" ] || { echo "Extension $EXT not found at $EXT_PATH" >&2; exit 1; }
      if [ -d ".specify/extensions/$EXT" ]; then
        echo "y" | specify extension remove "$EXT" >/dev/null 2>&1 || true
      fi
      # Always --dev: without it specify treats the path as a catalog name.
      # --dev copies the extension into the project, so a temporary source
      # can be deleted afterwards.
      specify extension add "$EXT_PATH" --dev

  - id: install-ext-spex-worktrees
    type: shell
    run: |
      SOURCE="${SPEX_SOURCE:-$SPECKIT_WORKFLOW_DIR}"
      EXT="spex-worktrees"
      EXT_PATH="$SOURCE/extensions/$EXT"
      [ -f "$EXT_PATH/extension.yml" ] || { echo "Extension $EXT not found at $EXT_PATH" >&2; exit 1; }
      if [ -d ".specify/extensions/$EXT" ]; then
        echo "y" | specify extension remove "$EXT" >/dev/null 2>&1 || true
      fi
      # Always --dev: without it specify treats the path as a catalog name.
      # --dev copies the extension into the project, so a temporary source
      # can be deleted afterwards.
      specify extension add "$EXT_PATH" --dev

  - id: install-ext-spex-deep-review
    type: shell
    run: |
      SOURCE="${SPEX_SOURCE:-$SPECKIT_WORKFLOW_DIR}"
      EXT="spex-deep-review"
      EXT_PATH="$SOURCE/extensions/$EXT"
      [ -f "$EXT_PATH/extension.yml" ] || { echo "Extension $EXT not found at $EXT_PATH" >&2; exit 1; }
      if [ -d ".specify/extensions/$EXT" ]; then
        echo "y" | specify extension remove "$EXT" >/dev/null 2>&1 || true
      fi
      # Always --dev: without it specify treats the path as a catalog name.
      # --dev copies the extension into the project, so a temporary source
      # can be deleted afterwards.
      specify extension add "$EXT_PATH" --dev

  - id: install-ext-spex-teams
    type: shell
    run: |
      SOURCE="${SPEX_SOURCE:-$SPECKIT_WORKFLOW_DIR}"
      EXT="spex-teams"
      EXT_PATH="$SOURCE/extensions/$EXT"
      [ -f "$EXT_PATH/extension.yml" ] || { echo "Extension $EXT not found at $EXT_PATH" >&2; exit 1; }
      if [ -d ".specify/extensions/$EXT" ]; then
        echo "y" | specify extension remove "$EXT" >/dev/null 2>&1 || true
      fi
      # Always --dev: without it specify treats the path as a catalog name.
      # --dev copies the extension into the project, so a temporary source
      # can be deleted afterwards.
      specify extension add "$EXT_PATH" --dev

  - id: install-ext-spex-collab
    type: shell
    run: |
      SOURCE="${SPEX_SOURCE:-$SPECKIT_WORKFLOW_DIR}"
      EXT="spex-collab"
      EXT_PATH="$SOURCE/extensions/$EXT"
      [ -f "$EXT_PATH/extension.yml" ] || { echo "Extension $EXT not found at $EXT_PATH" >&2; exit 1; }
      if [ -d ".specify/extensions/$EXT" ]; then
        echo "y" | specify extension remove "$EXT" >/dev/null 2>&1 || true
      fi
      # Always --dev: without it specify treats the path as a catalog name.
      # --dev copies the extension into the project, so a temporary source
      # can be deleted afterwards.
      specify extension add "$EXT_PATH" --dev

  - id: install-ext-spex-detach
    type: shell
    run: |
      SOURCE="${SPEX_SOURCE:-$SPECKIT_WORKFLOW_DIR}"
      EXT="spex-detach"
      EXT_PATH="$SOURCE/extensions/$EXT"
      [ -f "$EXT_PATH/extension.yml" ] || { echo "Extension $EXT not found at $EXT_PATH" >&2; exit 1; }
      if [ -d ".specify/extensions/$EXT" ]; then
        echo "y" | specify extension remove "$EXT" >/dev/null 2>&1 || true
      fi
      # Always --dev: without it specify treats the path as a catalog name.
      # --dev copies the extension into the project, so a temporary source
      # can be deleted afterwards.
      specify extension add "$EXT_PATH" --dev
      # spex-detach is opt-in: keep it disabled until apply-extensions enables
      # it for a selection that names it, so a run that fails in between
      # never leaves stealth mode switched on.
      specify extension disable "$EXT" >/dev/null 2>&1 || true

  # Nothing is enabled or disabled here: apply-extensions enforces the list
  # resolved by selected-extensions exactly, in every mode (FR-003).
  # scripts/spex-setup-report.sh prints this step's stderr by its id.
  - id: apply-extensions
    type: shell
    run: |
      SOURCE="{{ steps.validate-source.output.stdout }}"
      SELECTED="{{ steps.selected-extensions.output.stdout }}"
      SNAPSHOT=".specify/extensions/.registry.before"
      if [ -f "$SNAPSHOT" ]; then
        set -- --before "$SNAPSHOT" "$SELECTED"
      else
        set -- "$SELECTED"
      fi
      rc=0
      sh "$SOURCE/scripts/spex-apply-extensions.sh" "$@" || rc=$?
      rm -f "$SNAPSHOT"
      if [ "$rc" -ne 0 ]; then
        echo "ERROR: could not apply the extension selection ($SELECTED)" >&2
        exit "$rc"
      fi
      printf "ok"

  - id: enforce-git-extension
    type: shell
    run: |
      SOURCE="{{ steps.validate-source.output.stdout }}"
      SELECTED="{{ steps.selected-extensions.output.stdout }}"
      case ",$SELECTED," in
        *,spex-worktrees,*)
          if jq -e '.extensions.git.enabled == true' .specify/extensions/.registry >/dev/null 2>&1; then
            :
          elif specify extension enable git >/dev/null 2>&1 || specify extension add git >/dev/null 2>&1; then
            echo "Enabled git extension (required by spex-worktrees for branch creation)" >&2
          fi
          if ! jq -e '.extensions.git.enabled == true' .specify/extensions/.registry >/dev/null 2>&1; then
            echo "ERROR: spex-worktrees requires the spec-kit git extension" >&2
            echo "The git extension creates the feature branch inside the worktree; without it the branch would be made in the main checkout." >&2
            echo "Fix it with one of:" >&2
            echo "  specify extension add git      (or: specify extension enable git), then run setup again" >&2
            echo "  re-run setup with an extension selection that leaves out spex-worktrees, for example:" >&2
            echo "    specify workflow run \"$SOURCE/setup.yml\" -i extensions=spex-gates,spex-deep-review" >&2
            echo "    (Codex: \$cc-spex-init --extensions spex-gates,spex-deep-review)" >&2
            echo "  After a direct specify workflow run, sh \"$SOURCE/scripts/spex-setup-report.sh\" prints the extension changes and errors." >&2
            exit 1
          fi
          ;;
      esac
      printf "ok"

  - id: persist-request
    type: shell
    run: |
      SOURCE="{{ steps.validate-source.output.stdout }}"
      TOOL="$SOURCE/scripts/spex-setup-profile.py"
      HARNESS=$(printf '%s' '{{ steps.resolve-request.output.stdout }}' | jq -r '.harness')
      "$TOOL" resolve --root "$(pwd)" --harness "$HARNESS" \
        --extensions "{{ steps.selected-extensions.output.stdout }}" \
        --security "{{ steps.selected-security.output.stdout }}" |
        "$TOOL" persist --root "$(pwd)" >/dev/null
      echo "Saved requested setup to .specify/spex.json" >&2
      printf "ok"

  - id: adapt-commands
    type: shell
    run: |
      SOURCE="${SPEX_SOURCE:-$SPECKIT_WORKFLOW_DIR}"
      AGENT="{{ steps.detect-agent.output.stdout }}"
      ADAPT_SCRIPT="$SOURCE/scripts/spex-adapt-commands.sh"
      ADAPTERS_DIR="$SOURCE/scripts/adapters"
      COMMANDS_DIR=".specify/extensions"
      if [ ! -x "$ADAPT_SCRIPT" ]; then
        echo "Adaptation script not found, skipping command adaptation" >&2
        printf "skipped"
        exit 0
      fi
      if [ ! -d "$ADAPTERS_DIR/$AGENT" ]; then
        echo "No mapping table for $AGENT, commands remain neutral" >&2
        printf "neutral"
        exit 0
      fi
      "$ADAPT_SCRIPT" "$AGENT" "$COMMANDS_DIR" "$ADAPTERS_DIR" && printf "adapted"

  - id: adapt-harness
    type: switch
    expression: "{{ steps.detect-agent.output.stdout }}"
    cases:
      claude:
        - id: claude-statusline
          type: shell
          run: |
            SOURCE="${SPEX_SOURCE:-$SPECKIT_WORKFLOW_DIR}"
            STATUSLINE_SCRIPT="$SOURCE/scripts/spex-ship-statusline.sh"
            [ -f "$STATUSLINE_SCRIPT" ] || exit 0
            chmod +x "$STATUSLINE_SCRIPT" 2>/dev/null || true
            ABS_SCRIPT="$(cd "$(dirname "$STATUSLINE_SCRIPT")" && pwd)/$(basename "$STATUSLINE_SCRIPT")"
            SETTINGS=".claude/settings.local.json"
            CHAIN_FILE=".claude/.spex-previous-statusline"
            mkdir -p .claude
            if [ -f "$SETTINGS" ]; then
              if command -v jq >/dev/null 2>&1 && jq -e '.statusLine' "$SETTINGS" >/dev/null 2>&1; then
                CURRENT_CMD="$(jq -r '.statusLine.command // empty' "$SETTINGS")"
                if [ -n "$CURRENT_CMD" ]; then
                  case "$CURRENT_CMD" in
                    *spex-ship-statusline.sh*) exit 0 ;;
                  esac
                  # Save the whole command line (bare path or `bash script.sh --args`); if that
                  # fails, keep the user's status line rather than replace it.
                  if ! printf '%s\n' "$CURRENT_CMD" > "$CHAIN_FILE" 2>/dev/null; then
                    echo "WARNING: could not save the existing status line; leaving it unchanged" >&2
                    exit 0
                  fi
                fi
              fi
              TMP=$(mktemp)
              jq --arg cmd "$ABS_SCRIPT" '.statusLine = {"type": "command", "command": $cmd}' "$SETTINGS" > "$TMP"
              mv "$TMP" "$SETTINGS"
            else
              jq -n --arg cmd "$ABS_SCRIPT" '{statusLine: {type: "command", command: $cmd}}' > "$SETTINGS"
            fi
            echo "Status line configured" >&2
      codex:
        - id: codex-project
          type: shell
          run: |
            SOURCE="${SPEX_SOURCE:-$SPECKIT_WORKFLOW_DIR}"
            if ! RESULT=$("$SOURCE/scripts/configure-codex-project.py" --root "$(pwd)" \
              --security "{{ steps.selected-security.output.stdout }}"); then
              printf '%s\n' "$RESULT" >&2
              echo "ERROR: Codex project configuration was refused." >&2
              exit 1
            fi
            echo "Codex project guidance and permissions configured" >&2
      opencode:
        - id: opencode-plugin
          type: shell
          run: |
            SOURCE="${SPEX_SOURCE:-$SPECKIT_WORKFLOW_DIR}"
            mkdir -p .opencode/plugins
            PLUGIN="$SOURCE/scripts/adapters/opencode/spex-plugin.ts"
            if [ -f "$PLUGIN" ]; then
              cp "$PLUGIN" .opencode/plugins/spex-plugin.ts
              echo "OpenCode plugin installed" >&2
            fi
        - id: opencode-agents-md
          type: shell
          run: |
            SOURCE="${SPEX_SOURCE:-$SPECKIT_WORKFLOW_DIR}"
            TEMPLATE="$SOURCE/templates/agents-md/opencode.md"
            if [ -f "$TEMPLATE" ]; then
              cp "$TEMPLATE" AGENTS.md
              echo "AGENTS.md generated for OpenCode" >&2
            fi
    default:
      - id: default-harness
        type: shell
        run: |
          echo "No agent-specific configuration applied." >&2
          echo "Extensions installed with neutral defaults." >&2
          echo "Use 'specify extension list' to see available extensions." >&2

  - id: configure-permissions
    type: if
    condition: "{{ steps.selected-security.output.stdout != 'safe' }}"
    then:
      - id: permissions-dispatch
        type: switch
        expression: "{{ steps.detect-agent.output.stdout }}"
        cases:
          claude:
            - id: claude-permissions
              type: shell
              run: |
                LEVEL="{{ steps.selected-security.output.stdout }}"
                SETTINGS=".claude/settings.json"
                mkdir -p .claude

                if [ "$LEVEL" = "yolo" ]; then
                  ALLOW='["Bash(*)", "Read(*)", "Edit(*)", "Write(*)", "Skill", "Agent(*)", "WebFetch", "WebSearch", "EnterPlanMode", "ExitPlanMode", "EnterWorktree", "ExitWorktree"]'
                  MODE='"bypassPermissions"'
                else
                  ALLOW='["Skill", "Bash(specify *)", "Bash(*spex-init.sh*)", "Bash(*spex-ship-statusline.sh*)"]'
                  MODE='null'
                fi

                if [ -f "$SETTINGS" ]; then
                  TMP=$(mktemp)
                  if [ "$MODE" = "null" ]; then
                    jq --argjson allow "$ALLOW" '
                      .permissions.allow = ((.permissions.allow // []) + $allow | unique)
                    ' "$SETTINGS" > "$TMP"
                  else
                    jq --argjson allow "$ALLOW" --argjson mode "$MODE" '
                      .permissions.allow = ((.permissions.allow // []) + $allow | unique) |
                      .permissions.defaultMode = $mode
                    ' "$SETTINGS" > "$TMP"
                  fi
                  mv "$TMP" "$SETTINGS"
                else
                  if [ "$MODE" = "null" ]; then
                    jq -n --argjson allow "$ALLOW" '{permissions: {allow: $allow}}' > "$SETTINGS"
                  else
                    jq -n --argjson allow "$ALLOW" --argjson mode "$MODE" '{permissions: {defaultMode: $mode, allow: $allow}}' > "$SETTINGS"
                  fi
                fi
                echo "Claude Code permissions configured ($LEVEL)" >&2
          codex:
            - id: codex-permissions
              type: shell
              run: |
                echo "Codex permissions are managed in .codex/config.toml (configured in adapt-harness step)" >&2
          opencode:
            - id: opencode-permissions
              type: shell
              run: |
                echo "OpenCode permissions are managed via the spex-plugin.ts (configured in adapt-harness step)" >&2

  # Ignore rules go to .git/info/exclude, never to the tracked .gitignore.
  # Committing them pushes spex's local scaffolding into a repository that never
  # opted into spex, and the rules can be actively wrong there: OpenShell, for
  # one, uses .agents/ for its own contributor workflows.
  #
  # .git/info/exclude is per-clone and shared across worktrees (git-common-dir),
  # the same mechanism spex-detach uses for stealth mode.
  - id: configure-git-exclude
    type: shell
    run: |
      GIT_COMMON_DIR=$(git rev-parse --git-common-dir 2>/dev/null) || exit 0
      [ -n "$GIT_COMMON_DIR" ] || exit 0
      EXCLUDE_FILE="$GIT_COMMON_DIR/info/exclude"
      SENTINEL="# spex: generated/local files (only constitution is committed)"

      mkdir -p "$GIT_COMMON_DIR/info"
      [ -f "$EXCLUDE_FILE" ] || : > "$EXCLUDE_FILE"

      grep -qF "$SENTINEL" "$EXCLUDE_FILE" 2>/dev/null || printf '\n%s\n' "$SENTINEL" >> "$EXCLUDE_FILE"

      for pattern in '**/.claude/' '**/.agents/' '**/.codex/' '**/.specify/**' \
        '!**/.specify/spex.json' '!**/.specify/memory/' \
        '!**/.specify/memory/constitution.md'; do
        grep -qxF -- "$pattern" "$EXCLUDE_FILE" 2>/dev/null || printf '%s\n' "$pattern" >> "$EXCLUDE_FILE"
      done
      echo "Updated .git/info/exclude with spex patterns" >&2

      # Older spex versions appended these patterns to the tracked .gitignore,
      # where they get committed and show up in review. Report the leftovers,
      # but never edit a tracked file on the user's behalf.
      if [ -f ".gitignore" ] && grep -qF "# spex: generated/local files" ".gitignore" 2>/dev/null; then
        echo "" >&2
        echo "WARNING: .gitignore still holds a spex block from an earlier version." >&2
        echo "Those patterns now live in .git/info/exclude and are no longer needed here." >&2
        echo "Remove the block below from .gitignore so it stays out of your commits:" >&2
        grep -n -A7 -F "# spex: generated/local files" ".gitignore" | sed 's/^/  /' >&2
        echo "" >&2
      fi

  - id: fix-constitution
    type: shell
    run: |
      if [ -L ".specify/memory/constitution.md" ]; then
        if [ -f ".specify/memory/constitution.md" ]; then
          cat ".specify/memory/constitution.md" > ".specify/memory/constitution.md.tmp"
          rm ".specify/memory/constitution.md"
          mv ".specify/memory/constitution.md.tmp" ".specify/memory/constitution.md"
        fi
        [ -f "specs/constitution.md" ] && [ ! -L "specs/constitution.md" ] && rm "specs/constitution.md" || true
      elif [ -f "specs/constitution.md" ] && [ ! -e ".specify/memory/constitution.md" ]; then
        mkdir -p .specify/memory
        mv specs/constitution.md .specify/memory/constitution.md
      elif [ -f "specs/constitution.md" ] && [ -f ".specify/memory/constitution.md" ] && [ ! -L ".specify/memory/constitution.md" ]; then
        rm "specs/constitution.md"
      fi
      printf "ok"

  - id: check-update
    type: shell
    run: |
      command -v curl >/dev/null 2>&1 || exit 0
      command -v jq >/dev/null 2>&1 || exit 0
      RESPONSE=$(curl -sf --connect-timeout 2 --max-time 3 \
        "https://api.github.com/repos/rhuss/cc-spex/releases/latest" 2>/dev/null) || exit 0
      LATEST_TAG=$(echo "$RESPONSE" | jq -r '.tag_name // empty' 2>/dev/null)
      [ -n "$LATEST_TAG" ] || exit 0
      LATEST="${LATEST_TAG#v}"
      echo "Latest spex release: $LATEST" >&2
      printf "%s" "$LATEST"
