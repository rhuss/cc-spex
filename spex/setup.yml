schema_version: "1.0"
workflow:
  id: spex-setup
  name: Spex Setup
  version: "6.0.0"
  description: >-
    Install spex extensions and configure agent harness.
    Single-command entry point for Claude Code, Codex, OpenCode, or any spec-kit harness.

inputs:
  integration:
    type: string
    default: ""
    prompt: "Agent harness (auto, claude, codex, opencode)"
  extensions:
    type: string
    default: ""
    prompt: "Extensions to enable (recommended, all, interactive, or comma-separated list)"
  security:
    type: string
    default: ""
    prompt: "Requested security (safe, autonomous, yolo, or interactive)"
  permissions:
    type: string
    default: ""
    prompt: "Deprecated security alias (none, standard, or yolo)"

steps:
  - id: check-version
    type: shell
    run: |
      version_output=$(specify version 2>/dev/null) || {
        echo "ERROR: specify CLI not found. Install with:" >&2
        echo "  uv tool install specify-cli --force --from git+https://github.com/github/spec-kit.git" >&2
        exit 1
      }
      version=$(echo "$version_output" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)
      [ -n "$version" ] || { echo "ERROR: Cannot parse specify version" >&2; exit 1; }
      major=$(echo "$version" | cut -d. -f1)
      if [ "$major" -ge 1 ] 2>/dev/null; then
        printf "%s" "$version"
        exit 0
      fi
      echo "ERROR: spec-kit $version too old (requires >= 1.0.0). Upgrade:" >&2
      echo "  uv tool install specify-cli --force --from git+https://github.com/github/spec-kit.git" >&2
      exit 1

  - id: validate-source
    type: shell
    run: |
      SOURCE="${SPEX_SOURCE:-$SPECKIT_WORKFLOW_DIR}"
      if [ -z "$SOURCE" ]; then
        echo "ERROR: Cannot determine spex source directory." >&2
        echo "Run from a file (specify workflow run spex/setup.yml)" >&2
        echo "or set SPEX_SOURCE." >&2
        exit 1
      fi
      if [ ! -d "$SOURCE/extensions/spex" ]; then
        echo "ERROR: Spex extensions not found at $SOURCE/extensions/spex" >&2
        exit 1
      fi
      printf "%s" "$SOURCE"

  - id: resolve-request
    type: shell
    run: |
      SOURCE="{{ steps.validate-source.output.stdout }}"
      TOOL="$SOURCE/scripts/spex-setup-profile.py"
      [ -x "$TOOL" ] || { echo "ERROR: setup profile utility unavailable: $TOOL" >&2; exit 1; }
      set -- resolve --root "$(pwd)"
      INTEGRATION="{{ inputs.integration }}"
      EXTENSIONS="{{ inputs.extensions }}"
      SECURITY="{{ inputs.security }}"
      LEGACY_PERMISSIONS="{{ inputs.permissions }}"
      [ -z "$INTEGRATION" ] || set -- "$@" --harness "$INTEGRATION"
      case "$EXTENSIONS" in ""|interactive|recommended|all) ;; *) set -- "$@" --extensions "$EXTENSIONS" ;; esac
      case "$SECURITY" in ""|interactive) ;; *) set -- "$@" --security "$SECURITY" ;; esac
      if [ -z "$SECURITY" ] && [ -n "$LEGACY_PERMISSIONS" ]; then
        set -- "$@" --legacy-permissions "$LEGACY_PERMISSIONS"
      fi
      "$TOOL" "$@"

  - id: detect-agent
    type: shell
    run: |
      REQUEST='{{ steps.resolve-request.output.stdout }}'
      INPUT="{{ inputs.integration }}"
      [ -n "$INPUT" ] || INPUT=$(printf '%s' "$REQUEST" | jq -r '.harness')
      case "$INPUT" in
        auto) ;;
        claude|codex|opencode) printf "%s" "$INPUT"; exit 0 ;;
        *) echo "ERROR: Unknown integration '$INPUT'. Use: auto, claude, codex, opencode" >&2; exit 1 ;;
      esac
      DETECT_SCRIPT="${SPEX_SOURCE:-$SPECKIT_WORKFLOW_DIR}/scripts/hooks/shared/detect-agent.sh"
      if [ -f "$DETECT_SCRIPT" ]; then
        AGENT=$(sh "$DETECT_SCRIPT" "$(pwd)")
        printf "%s" "${AGENT:-claude}"
      else
        printf "%s" "claude"
      fi

  - id: migrate-commands
    type: shell
    run: |
      found=false
      for f in .claude/commands/speckit.*.md; do
        [ -f "$f" ] || continue
        found=true
        break
      done
      if [ "$found" = true ]; then
        for f in .claude/commands/speckit.*.md; do
          [ -f "$f" ] || continue
          rm "$f"
        done
        echo "Migrated old commands to skills format" >&2
      fi
      printf "ok"

  - id: init-project
    type: shell
    run: |
      AGENT="{{ steps.detect-agent.output.stdout }}"
      specify init --here --integration "$AGENT" --script sh --force

  - id: install-ext-spex
    type: shell
    run: |
      SOURCE="${SPEX_SOURCE:-$SPECKIT_WORKFLOW_DIR}"
      EXT="spex"
      EXT_PATH="$SOURCE/extensions/$EXT"
      [ -f "$EXT_PATH/extension.yml" ] || { echo "Extension $EXT not found at $EXT_PATH" >&2; exit 1; }
      if [ -d ".specify/extensions/$EXT" ]; then
        echo "y" | specify extension remove "$EXT" >/dev/null 2>&1 || true
      fi
      DEV_FLAG=""
      case "$SOURCE" in /tmp/*|"${TMPDIR:-/tmp}"/*) ;; *) DEV_FLAG="--dev" ;; esac
      specify extension add "$EXT_PATH" $DEV_FLAG

  - id: install-ext-spex-gates
    type: shell
    run: |
      SOURCE="${SPEX_SOURCE:-$SPECKIT_WORKFLOW_DIR}"
      EXT="spex-gates"
      EXT_PATH="$SOURCE/extensions/$EXT"
      [ -f "$EXT_PATH/extension.yml" ] || { echo "Extension $EXT not found at $EXT_PATH" >&2; exit 1; }
      if [ -d ".specify/extensions/$EXT" ]; then
        echo "y" | specify extension remove "$EXT" >/dev/null 2>&1 || true
      fi
      DEV_FLAG=""
      case "$SOURCE" in /tmp/*|"${TMPDIR:-/tmp}"/*) ;; *) DEV_FLAG="--dev" ;; esac
      specify extension add "$EXT_PATH" $DEV_FLAG

  - id: install-ext-spex-worktrees
    type: shell
    run: |
      SOURCE="${SPEX_SOURCE:-$SPECKIT_WORKFLOW_DIR}"
      EXT="spex-worktrees"
      EXT_PATH="$SOURCE/extensions/$EXT"
      [ -f "$EXT_PATH/extension.yml" ] || { echo "Extension $EXT not found at $EXT_PATH" >&2; exit 1; }
      if [ -d ".specify/extensions/$EXT" ]; then
        echo "y" | specify extension remove "$EXT" >/dev/null 2>&1 || true
      fi
      DEV_FLAG=""
      case "$SOURCE" in /tmp/*|"${TMPDIR:-/tmp}"/*) ;; *) DEV_FLAG="--dev" ;; esac
      specify extension add "$EXT_PATH" $DEV_FLAG

  - id: install-ext-spex-deep-review
    type: shell
    run: |
      SOURCE="${SPEX_SOURCE:-$SPECKIT_WORKFLOW_DIR}"
      EXT="spex-deep-review"
      EXT_PATH="$SOURCE/extensions/$EXT"
      [ -f "$EXT_PATH/extension.yml" ] || { echo "Extension $EXT not found at $EXT_PATH" >&2; exit 1; }
      if [ -d ".specify/extensions/$EXT" ]; then
        echo "y" | specify extension remove "$EXT" >/dev/null 2>&1 || true
      fi
      DEV_FLAG=""
      case "$SOURCE" in /tmp/*|"${TMPDIR:-/tmp}"/*) ;; *) DEV_FLAG="--dev" ;; esac
      specify extension add "$EXT_PATH" $DEV_FLAG

  - id: install-ext-spex-teams
    type: shell
    run: |
      SOURCE="${SPEX_SOURCE:-$SPECKIT_WORKFLOW_DIR}"
      EXT="spex-teams"
      EXT_PATH="$SOURCE/extensions/$EXT"
      [ -f "$EXT_PATH/extension.yml" ] || { echo "Extension $EXT not found at $EXT_PATH" >&2; exit 1; }
      if [ -d ".specify/extensions/$EXT" ]; then
        echo "y" | specify extension remove "$EXT" >/dev/null 2>&1 || true
      fi
      DEV_FLAG=""
      case "$SOURCE" in /tmp/*|"${TMPDIR:-/tmp}"/*) ;; *) DEV_FLAG="--dev" ;; esac
      specify extension add "$EXT_PATH" $DEV_FLAG

  - id: install-ext-spex-collab
    type: shell
    run: |
      SOURCE="${SPEX_SOURCE:-$SPECKIT_WORKFLOW_DIR}"
      EXT="spex-collab"
      EXT_PATH="$SOURCE/extensions/$EXT"
      [ -f "$EXT_PATH/extension.yml" ] || { echo "Extension $EXT not found at $EXT_PATH" >&2; exit 1; }
      if [ -d ".specify/extensions/$EXT" ]; then
        echo "y" | specify extension remove "$EXT" >/dev/null 2>&1 || true
      fi
      DEV_FLAG=""
      case "$SOURCE" in /tmp/*|"${TMPDIR:-/tmp}"/*) ;; *) DEV_FLAG="--dev" ;; esac
      specify extension add "$EXT_PATH" $DEV_FLAG

  - id: install-ext-spex-detach
    type: shell
    run: |
      SOURCE="${SPEX_SOURCE:-$SPECKIT_WORKFLOW_DIR}"
      EXT="spex-detach"
      EXT_PATH="$SOURCE/extensions/$EXT"
      [ -f "$EXT_PATH/extension.yml" ] || { echo "Extension $EXT not found at $EXT_PATH" >&2; exit 1; }
      if [ -d ".specify/extensions/$EXT" ]; then
        echo "y" | specify extension remove "$EXT" >/dev/null 2>&1 || true
      fi
      DEV_FLAG=""
      case "$SOURCE" in /tmp/*|"${TMPDIR:-/tmp}"/*) ;; *) DEV_FLAG="--dev" ;; esac
      specify extension add "$EXT_PATH" $DEV_FLAG
      specify extension disable "$EXT" 2>/dev/null || true

  - id: extension-mode
    type: shell
    run: |
      INPUT="{{ inputs.extensions }}"
      if [ -n "$INPUT" ]; then
        printf "%s" "$INPUT"
      elif [ -f .specify/spex.json ]; then
        printf '%s' '{{ steps.resolve-request.output.stdout }}' | jq -r '.extensions | join(",")'
      else
        printf "interactive"
      fi

  - id: select-extensions
    type: switch
    expression: "{{ steps.extension-mode.output.stdout }}"
    cases:
      recommended:
        - id: ext-recommended-noop
          type: shell
          run: printf "recommended"
      all:
        - id: ext-all-noop
          type: shell
          run: printf "all"
      interactive:
        - id: ext-interactive-prompt
          type: prompt
          prompt: >-
            The following optional spex extensions are available. Reply with a
            comma-separated list of the extensions you want to KEEP enabled.
            Extensions not listed will be disabled.

            - spex-gates: Quality gates (spec, plan, code review)
            - spex-worktrees: Git worktree isolation for feature branches
            - spex-deep-review: Multi-perspective code review with 5 agents
            - spex-teams: Parallel implementation via agent teams
            - spex-collab: Collaborative PR workflows (reviewers, phases, triage)
            - spex-detach: Strip spec artifacts for upstream PRs

            Reply with extension names separated by commas (e.g. "spex-gates,spex-worktrees"),
            or "all" to keep everything enabled.
          integration: "{{ steps.detect-agent.output.stdout }}"
        - id: ext-interactive-fallback
          type: shell
          run: |
            RESPONSE="{{ steps.ext-interactive-prompt.output.stdout | default('') }}"
            if [ -z "$RESPONSE" ] || [ "$RESPONSE" = "all" ]; then
              echo "All extensions enabled." >&2
              printf "ok"
              exit 0
            fi
            OPTIONAL_EXTS="spex-gates spex-worktrees spex-deep-review spex-teams spex-collab spex-detach"
            GATES_DEPENDENTS="spex-teams spex-deep-review spex-collab"
            ENABLED_LIST=$(echo "$RESPONSE" | tr ',' ' ' | tr -d '"')
            # Enforce gates dependency
            gates_needed=false
            for dep in $GATES_DEPENDENTS; do
              for sel in $ENABLED_LIST; do
                [ "$dep" = "$sel" ] && gates_needed=true
              done
            done
            if [ "$gates_needed" = true ]; then
              gates_in_list=false
              for sel in $ENABLED_LIST; do
                [ "$sel" = "spex-gates" ] && gates_in_list=true
              done
              if [ "$gates_in_list" = false ]; then
                echo "Auto-enabling spex-gates (required by selected extensions)" >&2
                ENABLED_LIST="spex-gates $ENABLED_LIST"
              fi
            fi
            for ext in $OPTIONAL_EXTS; do
              found=false
              for sel in $ENABLED_LIST; do
                if [ "$ext" = "$sel" ]; then found=true; break; fi
              done
              if [ "$found" = false ]; then
                specify extension disable "$ext" 2>/dev/null || true
              fi
            done
            echo "Extension selection applied." >&2
            printf "ok"
    default:
      - id: ext-filter
        type: shell
        run: |
          SELECTION="{{ steps.extension-mode.output.stdout }}"
          OPTIONAL_EXTS="spex-gates spex-worktrees spex-deep-review spex-teams spex-collab spex-detach"
          GATES_DEPENDENTS="spex-teams spex-deep-review spex-collab"
          ENABLED_LIST=$(echo "$SELECTION" | tr ',' ' ')

          # Enforce dependencies: if any gates-dependent is selected, auto-enable spex-gates
          gates_needed=false
          for dep in $GATES_DEPENDENTS; do
            for sel in $ENABLED_LIST; do
              if [ "$dep" = "$sel" ]; then
                gates_needed=true
                break
              fi
            done
          done
          if [ "$gates_needed" = true ]; then
            gates_in_list=false
            for sel in $ENABLED_LIST; do
              [ "$sel" = "spex-gates" ] && gates_in_list=true
            done
            if [ "$gates_in_list" = false ]; then
              echo "Auto-enabling spex-gates (required by selected extensions)" >&2
              ENABLED_LIST="spex-gates $ENABLED_LIST"
            fi
          fi

          # Disable extensions not in the selection
          for ext in $OPTIONAL_EXTS; do
            found=false
            for sel in $ENABLED_LIST; do
              if [ "$ext" = "$sel" ]; then
                found=true
                break
              fi
            done
            if [ "$found" = false ]; then
              specify extension disable "$ext" 2>/dev/null || true
              echo "Disabled: $ext" >&2
            fi
          done
          printf "ok"

  - id: selected-extensions
    type: shell
    run: |
      MODE="{{ steps.extension-mode.output.stdout }}"
      case "$MODE" in
        interactive)
          SELECTION="{{ steps.ext-interactive-prompt.output.stdout | default('') }}"
          SELECTION=$(printf '%s' "$SELECTION" | tr -d '"')
          [ -n "$SELECTION" ] || SELECTION="spex-gates,spex-worktrees,spex-deep-review"
          [ "$SELECTION" != "all" ] || SELECTION="spex-gates,spex-worktrees,spex-deep-review,spex-teams,spex-collab,spex-detach"
          ;;
        recommended) SELECTION="spex-gates,spex-worktrees,spex-deep-review" ;;
        all) SELECTION="spex-gates,spex-worktrees,spex-deep-review,spex-teams,spex-collab,spex-detach" ;;
        *) SELECTION="$MODE" ;;
      esac
      SOURCE="{{ steps.validate-source.output.stdout }}"
      "$SOURCE/scripts/spex-setup-profile.py" resolve --root "$(pwd)" \
        --extensions "spex,$SELECTION" | jq -r '.extensions | join(",")'

  - id: enforce-git-extension
    type: shell
    run: |
      SELECTED="{{ steps.selected-extensions.output.stdout }}"
      case ",$SELECTED," in
        *,spex-worktrees,*)
          if specify extension enable git 2>/dev/null; then
            echo "Enabled git extension (required by spex-worktrees for branch creation)" >&2
          elif ! specify extension list 2>/dev/null | grep -q "^.*git.*Enabled"; then
            echo "WARNING: git extension not available. spex-worktrees requires it for branch creation." >&2
            echo "Worktree creation will fail until the git extension is installed." >&2
          fi
          ;;
      esac
      printf "ok"

  - id: security-mode
    type: shell
    run: |
      INPUT="{{ inputs.security }}"
      LEGACY="{{ inputs.permissions }}"
      if [ -n "$INPUT" ]; then
        printf "%s" "$INPUT"
      elif [ -n "$LEGACY" ]; then
        case "$LEGACY" in
          none) printf "safe" ;;
          standard) printf "autonomous" ;;
          yolo) printf "yolo" ;;
          *) echo "ERROR: Unknown deprecated permissions '$LEGACY'. Use none, standard, or yolo" >&2; exit 1 ;;
        esac
      elif [ -f .specify/spex.json ]; then
        printf '%s' '{{ steps.resolve-request.output.stdout }}' | jq -r '.security'
      else
        printf "interactive"
      fi

  - id: select-security
    type: switch
    expression: "{{ steps.security-mode.output.stdout }}"
    cases:
      interactive:
        - id: security-interactive-prompt
          type: prompt
          prompt: >-
            Select requested project security. Safe (recommended) preserves the
            host policy. Autonomous reduces prompts for enumerated Spex project
            operations. YOLO requests unrestricted filesystem and network access
            without approval prompts. Reply: safe, autonomous, or yolo.
          integration: "{{ steps.detect-agent.output.stdout }}"
    default:
      - id: security-noop
        type: shell
        run: printf "ok"

  - id: selected-security
    type: shell
    run: |
      MODE="{{ steps.security-mode.output.stdout }}"
      if [ "$MODE" = "interactive" ]; then
        SELECTED="{{ steps.security-interactive-prompt.output.stdout | default('safe') }}"
        SELECTED=$(printf '%s' "$SELECTED" | tr -d '"[:space:]')
        [ -n "$SELECTED" ] || SELECTED="safe"
      else
        SELECTED="$MODE"
      fi
      SELECTED=$(printf '%s' "$SELECTED" | tr -d '"[:space:]')
      case "$SELECTED" in safe|autonomous|yolo) printf "%s" "$SELECTED" ;;
        *) echo "ERROR: Unknown security '$SELECTED'. Use safe, autonomous, or yolo" >&2; exit 1 ;;
      esac

  - id: persist-request
    type: shell
    run: |
      SOURCE="{{ steps.validate-source.output.stdout }}"
      TOOL="$SOURCE/scripts/spex-setup-profile.py"
      HARNESS=$(printf '%s' '{{ steps.resolve-request.output.stdout }}' | jq -r '.harness')
      "$TOOL" resolve --root "$(pwd)" --harness "$HARNESS" \
        --extensions "{{ steps.selected-extensions.output.stdout }}" \
        --security "{{ steps.selected-security.output.stdout }}" |
        "$TOOL" persist --root "$(pwd)" >/dev/null
      echo "Saved requested setup to .specify/spex.json" >&2
      printf "ok"

  - id: adapt-commands
    type: shell
    run: |
      SOURCE="${SPEX_SOURCE:-$SPECKIT_WORKFLOW_DIR}"
      AGENT="{{ steps.detect-agent.output.stdout }}"
      ADAPT_SCRIPT="$SOURCE/scripts/spex-adapt-commands.sh"
      ADAPTERS_DIR="$SOURCE/scripts/adapters"
      COMMANDS_DIR=".specify/extensions"
      if [ ! -x "$ADAPT_SCRIPT" ]; then
        echo "Adaptation script not found, skipping command adaptation" >&2
        printf "skipped"
        exit 0
      fi
      if [ ! -d "$ADAPTERS_DIR/$AGENT" ]; then
        echo "No mapping table for $AGENT, commands remain neutral" >&2
        printf "neutral"
        exit 0
      fi
      "$ADAPT_SCRIPT" "$AGENT" "$COMMANDS_DIR" "$ADAPTERS_DIR" && printf "adapted"

  - id: adapt-harness
    type: switch
    expression: "{{ steps.detect-agent.output.stdout }}"
    cases:
      claude:
        - id: claude-statusline
          type: shell
          run: |
            SOURCE="${SPEX_SOURCE:-$SPECKIT_WORKFLOW_DIR}"
            STATUSLINE_SCRIPT="$SOURCE/scripts/spex-ship-statusline.sh"
            [ -f "$STATUSLINE_SCRIPT" ] || exit 0
            chmod +x "$STATUSLINE_SCRIPT" 2>/dev/null || true
            ABS_SCRIPT="$(cd "$(dirname "$STATUSLINE_SCRIPT")" && pwd)/$(basename "$STATUSLINE_SCRIPT")"
            SETTINGS=".claude/settings.local.json"
            CHAIN_FILE=".claude/.spex-previous-statusline"
            mkdir -p .claude
            if [ -f "$SETTINGS" ]; then
              if command -v jq >/dev/null 2>&1 && jq -e '.statusLine' "$SETTINGS" >/dev/null 2>&1; then
                CURRENT_CMD="$(jq -r '.statusLine.command // empty' "$SETTINGS")"
                if [ -n "$CURRENT_CMD" ] && [ -f "$CURRENT_CMD" ]; then
                  case "$CURRENT_CMD" in
                    *spex-ship-statusline.sh) exit 0 ;;
                  esac
                  echo "$CURRENT_CMD" > "$CHAIN_FILE"
                fi
              fi
              TMP=$(mktemp)
              jq --arg cmd "$ABS_SCRIPT" '.statusLine = {"type": "command", "command": $cmd}' "$SETTINGS" > "$TMP"
              mv "$TMP" "$SETTINGS"
            else
              jq -n --arg cmd "$ABS_SCRIPT" '{statusLine: {type: "command", command: $cmd}}' > "$SETTINGS"
            fi
            echo "Status line configured" >&2
      codex:
        - id: codex-project
          type: shell
          run: |
            SOURCE="${SPEX_SOURCE:-$SPECKIT_WORKFLOW_DIR}"
            if ! RESULT=$("$SOURCE/scripts/configure-codex-project.py" --root "$(pwd)" \
              --security "{{ steps.selected-security.output.stdout }}"); then
              printf '%s\n' "$RESULT" >&2
              echo "ERROR: Codex project configuration was refused." >&2
              exit 1
            fi
            echo "Codex project guidance and permissions configured" >&2
      opencode:
        - id: opencode-plugin
          type: shell
          run: |
            SOURCE="${SPEX_SOURCE:-$SPECKIT_WORKFLOW_DIR}"
            mkdir -p .opencode/plugins
            PLUGIN="$SOURCE/scripts/adapters/opencode/spex-plugin.ts"
            if [ -f "$PLUGIN" ]; then
              cp "$PLUGIN" .opencode/plugins/spex-plugin.ts
              echo "OpenCode plugin installed" >&2
            fi
        - id: opencode-agents-md
          type: shell
          run: |
            SOURCE="${SPEX_SOURCE:-$SPECKIT_WORKFLOW_DIR}"
            TEMPLATE="$SOURCE/templates/agents-md/opencode.md"
            if [ -f "$TEMPLATE" ]; then
              cp "$TEMPLATE" AGENTS.md
              echo "AGENTS.md generated for OpenCode" >&2
            fi
    default:
      - id: default-harness
        type: shell
        run: |
          echo "No agent-specific configuration applied." >&2
          echo "Extensions installed with neutral defaults." >&2
          echo "Use 'specify extension list' to see available extensions." >&2

  - id: configure-permissions
    type: if
    condition: "{{ steps.selected-security.output.stdout != 'safe' }}"
    then:
      - id: permissions-dispatch
        type: switch
        expression: "{{ steps.detect-agent.output.stdout }}"
        cases:
          claude:
            - id: claude-permissions
              type: shell
              run: |
                LEVEL="{{ steps.selected-security.output.stdout }}"
                SETTINGS=".claude/settings.json"
                mkdir -p .claude

                if [ "$LEVEL" = "yolo" ]; then
                  ALLOW='["Bash(*)", "Read(*)", "Edit(*)", "Write(*)", "Skill", "Agent(*)", "WebFetch", "WebSearch", "EnterPlanMode", "ExitPlanMode", "EnterWorktree", "ExitWorktree"]'
                  MODE='"bypassPermissions"'
                else
                  ALLOW='["Skill", "Bash(specify *)", "Bash(*spex-init.sh*)", "Bash(*spex-ship-statusline.sh*)"]'
                  MODE='null'
                fi

                if [ -f "$SETTINGS" ]; then
                  TMP=$(mktemp)
                  if [ "$MODE" = "null" ]; then
                    jq --argjson allow "$ALLOW" '
                      .permissions.allow = ((.permissions.allow // []) + $allow | unique)
                    ' "$SETTINGS" > "$TMP"
                  else
                    jq --argjson allow "$ALLOW" --argjson mode "$MODE" '
                      .permissions.allow = ((.permissions.allow // []) + $allow | unique) |
                      .permissions.defaultMode = $mode
                    ' "$SETTINGS" > "$TMP"
                  fi
                  mv "$TMP" "$SETTINGS"
                else
                  if [ "$MODE" = "null" ]; then
                    jq -n --argjson allow "$ALLOW" '{permissions: {allow: $allow}}' > "$SETTINGS"
                  else
                    jq -n --argjson allow "$ALLOW" --argjson mode "$MODE" '{permissions: {defaultMode: $mode, allow: $allow}}' > "$SETTINGS"
                  fi
                fi
                echo "Claude Code permissions configured ($LEVEL)" >&2
          codex:
            - id: codex-permissions
              type: shell
              run: |
                echo "Codex permissions are managed in .codex/config.toml (configured in adapt-harness step)" >&2
          opencode:
            - id: opencode-permissions
              type: shell
              run: |
                echo "OpenCode permissions are managed via the spex-plugin.ts (configured in adapt-harness step)" >&2

  - id: configure-gitignore
    type: shell
    run: |
      GITIGNORE=".gitignore"
      SENTINEL="# spex: generated/local files"
      if [ -f "$GITIGNORE" ]; then
        if grep -qF ".claude/commands/speckit." "$GITIGNORE" 2>/dev/null; then
          sed -i.bak 's|\.claude/commands/speckit\.\*|.claude/skills/|' "$GITIGNORE" && rm -f "$GITIGNORE.bak"
        elif grep -qF ".claude/skills/speckit-*" "$GITIGNORE" 2>/dev/null; then
          sed -i.bak 's|\.claude/skills/speckit-\*|.claude/skills/|' "$GITIGNORE" && rm -f "$GITIGNORE.bak"
        fi
        if grep -qF ".specify/.spex-phase" "$GITIGNORE" 2>/dev/null; then
          sed -i.bak '/.specify\/.spex-phase/d;/.specify\/.spex-state/d;/.claude\/skills\//d;/.claude\/settings\.local\.json/d' "$GITIGNORE" && rm -f "$GITIGNORE.bak"
        fi
      fi
      if [ -f "$GITIGNORE" ] && grep -qF "$SENTINEL" "$GITIGNORE" 2>/dev/null; then
        for pattern in '**/.claude/' '**/.agents/' '**/.codex/' '**/.specify/**' \
          '!**/.specify/spex.json' '!**/.specify/memory/' \
          '!**/.specify/memory/constitution.md'; do
          grep -qxF -- "$pattern" "$GITIGNORE" 2>/dev/null || printf '%s\n' "$pattern" >> "$GITIGNORE"
        done
        exit 0
      fi
      cat >> "$GITIGNORE" << 'GIEOF'

      # spex: generated/local files (only constitution is committed)
      **/.claude/
      **/.agents/
      **/.codex/
      **/.specify/**
      !**/.specify/spex.json
      !**/.specify/memory/
      !**/.specify/memory/constitution.md
      GIEOF
      echo "Updated .gitignore with spex patterns" >&2

  - id: fix-constitution
    type: shell
    run: |
      if [ -L ".specify/memory/constitution.md" ]; then
        if [ -f ".specify/memory/constitution.md" ]; then
          cat ".specify/memory/constitution.md" > ".specify/memory/constitution.md.tmp"
          rm ".specify/memory/constitution.md"
          mv ".specify/memory/constitution.md.tmp" ".specify/memory/constitution.md"
        fi
        [ -f "specs/constitution.md" ] && [ ! -L "specs/constitution.md" ] && rm "specs/constitution.md" || true
      elif [ -f "specs/constitution.md" ] && [ ! -e ".specify/memory/constitution.md" ]; then
        mkdir -p .specify/memory
        mv specs/constitution.md .specify/memory/constitution.md
      elif [ -f "specs/constitution.md" ] && [ -f ".specify/memory/constitution.md" ] && [ ! -L ".specify/memory/constitution.md" ]; then
        rm "specs/constitution.md"
      fi
      printf "ok"

  - id: check-update
    type: shell
    run: |
      command -v curl >/dev/null 2>&1 || exit 0
      command -v jq >/dev/null 2>&1 || exit 0
      RESPONSE=$(curl -sf --connect-timeout 2 --max-time 3 \
        "https://api.github.com/repos/rhuss/cc-spex/releases/latest" 2>/dev/null) || exit 0
      LATEST_TAG=$(echo "$RESPONSE" | jq -r '.tag_name // empty' 2>/dev/null)
      [ -n "$LATEST_TAG" ] || exit 0
      LATEST="${LATEST_TAG#v}"
      echo "Latest spex release: $LATEST" >&2
      printf "%s" "$LATEST"
